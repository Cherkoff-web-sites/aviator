services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: "3001"
      STORE_PATH: /app/data/store.json
    volumes:
      - store_data:/app/data
    expose:
      - "3001"
    restart: unless-stopped

  web:
    build:
      context: ./prod
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  store_data:
